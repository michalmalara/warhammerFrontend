<mat-card class="ph-card">
  <div class="ph-title muted">Profession History</div>

  @if (entries.length > 0) {
    <ol class="timeline" role="list">
      @for (entry of entries; track entry.id) {
        <li class="timeline-item">
          <div class="marker" aria-hidden="true"></div>

          <div class="item-content">
            <div class="top-row">
              <div class="profession">
                <span class="name">{{ entry.profession }}</span>
              </div>

              @if (entry.dateLabel) {
                <div class="date muted">{{ entry.dateLabel }}</div>
              }
            </div>

            @if (entry.note) {
              <div class="note muted">{{ entry.note }}</div>
            }
          </div>
        </li>
      }
    </ol>
  } @else {
    <div class="empty muted">Brak wpisów historii profesji.</div>
  }
</mat-card>
