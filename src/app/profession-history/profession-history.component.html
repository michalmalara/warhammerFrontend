<mat-card class="ph-card">
  <profession-xp-panel
    class="xp-section"
    [xpCurrent]="xpCurrent"
    [xpMax]="xpMax"
    [xpToSpend]="xpToSpend"
    [xpTotalEarned]="xpTotalEarned"
  ></profession-xp-panel>

  <div class="ph-title muted">Profession History</div>

  @if (entries.length > 0) {
    <ol class="timeline" role="list">
      @for (entry of entries; track entry.id) {
        <li class="timeline-item">
          <div class="marker" aria-hidden="true"></div>

          <div class="item-content">
            <div class="top-row">
              <div class="profession">
                <span class="name">{{ entry.profession }}</span>
              </div>

              @if (entry.dateLabel) {
                <div class="date muted">{{ entry.dateLabel }}</div>
              }
            </div>
          </div>
        </li>
      }
    </ol>
  } @else {
    <div class="empty muted">No profession history entries.</div>
  }
</mat-card>
