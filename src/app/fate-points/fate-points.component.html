<mat-card class="fate-card">
  <div class="title muted" i18n="Nagłówek panelu punktów losu@@fatePoints.title">Fate Points</div>

  <div
    class="dots"
    role="img"
    i18n-aria-label="Etykieta dostępności dla wskaźnika punktów losu@@fatePoints.aria"
    aria-label="Fate points"
  >
    @for (i of dots(); track i) {
      <span class="dot" [class.filled]="isFilledDot(i)"></span>
    }
  </div>

  <div class="counts">
    <div class="col">
      <div class="label muted" i18n="Etykieta kolumny: Fate@@fatePoints.fateLabel">Fate</div>
      <div class="value">{{ clampedFateCurrent }}</div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="col">
      <div class="label muted" i18n="Etykieta kolumny: Fortune@@fatePoints.fortuneLabel">Fortune</div>
      <div class="value accent">{{ fortuneCurrent }}</div>
    </div>
  </div>
</mat-card>
