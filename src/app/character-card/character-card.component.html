<section class="character-card card">
  <div class="card-inner">
    <main class="main">
      <header class="dashboard-header">
        <div class="dashboard-left">
          <div class="subtitle muted">{{ subtitle }}</div>
          <h1 class="title">{{ name }}</h1>

          <div class="title-tags">
            <span class="tag muted">Human</span>
            <span class="tag muted">Empire Heritage</span>
          </div>
        </div>

        <div class="dashboard-right">
          <div class="xp-panel card">
            <div class="xp-label muted">Experience Points</div>
            <div class="xp-bar">
              <div class="fill" [style.width]="xpPercent + '%'" aria-hidden="true"></div>
            </div>
            <div class="xp-numbers">{{ xpCurrent }} / {{ xpMax }} XP</div>
          </div>
        </div>
      </header>

      <section class="content">
        <div class="content-columns">
          <!-- Left column: stats + wounds moved above tabs -->
          <div class="left-column">
            <div class="stats-and-wounds-row">
              <character-stats [primaryStats]="primaryStats" [secondaryStats]="secondaryStats"></character-stats>
              <wounds-panel [(woundsCurrent)]="woundsCurrent" [woundsMax]="woundsMax"></wounds-panel>
            </div>

            <!-- Angular Material Tabs: Combat / Inventory -->
            <mat-tab-group>
              <mat-tab label="Skills">
                <skills [skills]="skills"></skills>
              </mat-tab>

              <mat-tab label="Talents">
                <talents [talents]="talents"></talents>
              </mat-tab>

              <mat-tab label="Combat">
                <equipment-table></equipment-table>
              </mat-tab>

              <mat-tab label="Inventory">
                <!-- Placeholder / future inventory content -->
                <div class="inventory-placeholder card">
                  <p class="muted">Inventory view is under construction — move or copy items here as needed.</p>
                </div>
              </mat-tab>
            </mat-tab-group>

          </div>

          <!-- Right column: fate/fortune -->
          <aside class="right-column">
            <fate-points
              [fateMax]="fateMax"
              [fateCurrent]="fateCurrent"
              [fortuneCurrent]="fortuneCurrent"
            ></fate-points>
          </aside>

        </div>

      </section>
    </main>
  </div>
</section>
