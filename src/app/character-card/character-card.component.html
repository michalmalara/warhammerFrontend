<section class="character-card card">
  <div class="card-inner">
    <main class="main">
      <header class="dashboard-header">
        <div class="dashboard-left">
          <div class="subtitle muted">{{ subtitle }}</div>
          <h1 class="title">{{ name }}</h1>

          <div class="title-tags">
            <span class="tag muted">Human</span>
            <span class="tag muted">Empire Heritage</span>
          </div>
        </div>

        <div class="dashboard-right">
          <div class="xp-panel card">
            <div class="xp-label muted">Experience Points</div>
            <div class="xp-bar">
              <div class="fill" [style.width]="xpPercent + '%'" aria-hidden="true"></div>
            </div>
            <div class="xp-numbers">{{ xpCurrent }} / {{ xpMax }} XP</div>
          </div>
        </div>
      </header>

      <section class="content">
        <div class="content-columns" style="display:flex; gap:1rem; align-items:flex-start;">

          <!-- Left column: stats + equipment table -->
          <div class="left-column" style="flex:1; min-width:260px;">
            <character-stats [primaryStats]="primaryStats" [secondaryStats]="secondaryStats"></character-stats>

            <h2 class="section-title">Combat Equipment</h2>

            <div class="equipment-table mat-elevation-z1">
              <table mat-table [dataSource]="dataSource" class="mat-table equipment-table__table">

                <thead class="equipment-table__head">
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                </thead>

                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef class="table-header"> Weapon / Gear </th>
                  <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <ng-container matColumnDef="enc">
                  <th mat-header-cell *matHeaderCellDef class="table-header"> Enc </th>
                  <td mat-cell *matCellDef="let element"> {{element.enc}} </td>
                </ng-container>

                <ng-container matColumnDef="dmg">
                  <th mat-header-cell *matHeaderCellDef class="table-header"> Dmg </th>
                  <td mat-cell *matCellDef="let element"> {{element.dmg}} </td>
                </ng-container>

                <ng-container matColumnDef="range">
                  <th mat-header-cell *matHeaderCellDef class="table-header"> Range </th>
                  <td mat-cell *matCellDef="let element"> {{element.range}} </td>
                </ng-container>

                <ng-container matColumnDef="qualities">
                  <th mat-header-cell *matHeaderCellDef class="table-header"> Qualities </th>
                  <td mat-cell *matCellDef="let element"> {{element.qualities}} </td>
                </ng-container>

                <tr mat-row *matRowDef="let _row; columns: displayedColumns"></tr>
              </table>
            </div>

          </div>

          <!-- Right column: wounds card -->
          <aside class="right-column" style="flex:0 0 320px; max-width:360px;">
            <wounds-panel [(woundsCurrent)]="woundsCurrent" [woundsMax]="woundsMax"></wounds-panel>
          </aside>

        </div>

      </section>
    </main>
  </div>
</section>
