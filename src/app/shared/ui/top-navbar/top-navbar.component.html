<mat-toolbar class="top-navbar" role="banner">
  <a mat-button class="top-navbar__brand" [routerLink]="'/'" aria-label="Home"
     i18n-aria-label="ARIA@@app.home">
    <span class="top-navbar__title">{{ title }}</span>
  </a>

  <span class="top-navbar__spacer"></span>

  <nav class="top-navbar__nav" aria-label="Main navigation" i18n-aria-label="ARIA@@app.nav.aria">
    @for (link of links; track link.path) {
      <a
        mat-button
        class="top-navbar__link"
        [routerLink]="link.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  @if (isLogged()) {
    <button mat-button class="top-navbar__link" (click)="onLogout()" i18n="Logout button@@auth.logout">
      Logout
    </button>
  }
</mat-toolbar>
