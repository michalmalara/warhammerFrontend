<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="talent-delete-title">
  <div class="modal">
    <div class="corner top-left" aria-hidden="true">
      <mat-icon fontIcon="flare"></mat-icon>
    </div>
    <div class="corner top-right" aria-hidden="true">
      <mat-icon fontIcon="flare"></mat-icon>
    </div>
    <div class="corner bottom-left" aria-hidden="true">
      <mat-icon fontIcon="flare"></mat-icon>
    </div>
    <div class="corner bottom-right" aria-hidden="true">
      <mat-icon fontIcon="flare"></mat-icon>
    </div>

    <div class="header">
      <h2 id="talent-delete-title" class="title" i18n="Dialog title@@talentDelete.title">Are you sure you want to delete
        this talent?</h2>
    </div>

    <div class="talent">
      <span class="talent-name">{{ data.talentName }}</span>
    </div>

    <div class="body">
      <p class="quote" i18n="Quote@@talentDelete.quote">"Knowledge once lost may never be reclaimed."</p>
    </div>

    <div class="actions">
      <app-wax-seal-button
        variant="cancel"
        icon="close"
        label="Cancel"
        i18n-label="Button@@talentDelete.cancel"
        (clicked)="cancel()"
      ></app-wax-seal-button>

      <app-wax-seal-button
        variant="save"
        icon="delete_forever"
        label="Delete"
        i18n-label="Button@@talentDelete.confirm"
        (clicked)="confirm()"
      ></app-wax-seal-button>
    </div>

    <div class="bottom-detail" aria-hidden="true">
      <span class="line"></span>
      <mat-icon class="skull" fontIcon="skull"></mat-icon>
      <span class="line"></span>
    </div>
  </div>
</div>
