<mat-card class="wounds-panel"
          [ngClass]="{ 'wounds-critical': isCritical, 'wounds-wounded': isWounded, 'wounds-healthy': isHealthy, 'wounds-slightly': isSlightlyWounded }">
  <mat-card-header>
    <div class="wounds-header muted">Wounds</div>
  </mat-card-header>
  <mat-card-content class="wounds-body">
    <div class="wounds-display">
      <div class="wounds-value" aria-live="polite">{{ woundsDisplay }}</div>
      <div class="wounds-current-label">HP</div>
    </div>

    <div class="wounds-controls">
      <button mat-icon-button color="primary" (click)="decWounds()" aria-label="Decrease wounds" [disabled]="woundsCurrent <= 0">
        <mat-icon>remove</mat-icon>
      </button>
      <div class="wounds-max">Max: <span class="wounds-max-value">{{ woundsMax }}</span></div>
      <button mat-icon-button color="primary" (click)="incWounds()" aria-label="Increase wounds" [disabled]="woundsCurrent >= woundsMax">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <div class="wounds-note muted">{{ woundsStatus }}</div>
  </mat-card-content>
</mat-card>
