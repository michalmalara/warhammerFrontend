<section class="talents card">
  @if (talents.length) {
    <div class="talents-grid">
      @for (t of talents; track t.id) {
        <mat-card class="talent-card">
          <mat-card-title class="name">{{ t.name }}</mat-card-title>
          <mat-card-content class="description muted">{{ t.description }}</mat-card-content>
        </mat-card>
      }
    </div>
  } @else {
    <div class="empty muted">Brak talentów.</div>
  }
</section>
