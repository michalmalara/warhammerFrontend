<!-- przeniesione 1:1 z app/fate-points -->

<mat-card class="fate-card">
  <div class="title muted" i18n="Fate points panel heading@@fatePoints.title">Fate Points</div>

  <div
    class="dots"
    role="img"
    i18n-aria-label="Availability label for fate points indicator@@fatePoints.aria"
    aria-label="Fate points"
  >
    @for (i of dots(); track i) {
      <span class="dot" [class.filled]="isFilledDot(i)"></span>
    }
  </div>

  <div class="counts">
    <div class="col">
      <div class="label muted" i18n="Column label: Fate@@fatePoints.fateLabel">Fate</div>
      <div class="value">{{ clampedFateCurrent }}</div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="col">
      <div class="label muted" i18n="Column label: Fortune@@fatePoints.fortuneLabel">
        Fortune
      </div>
      <div class="value accent">{{ fortuneCurrent }}</div>
    </div>
  </div>
</mat-card>
