<!-- przeniesione 1:1 z app/profession-history -->

<mat-card class="xp-panel">
  <div class="xp-label muted" i18n="Experience panel heading@@xp.title">Experience</div>

  <div class="xp-top-row">
    @if (currentProfession) {
      <div class="xp-current-profession">
        <div
          class="xp-current-profession-label muted"
          i18n="Label: current profession@@xp.currentProfessionLabel"
        >
          Current profession
        </div>
        <div class="xp-current-profession-value">{{ currentProfession }}</div>
      </div>
    }

    <div class="xp-metrics">
      <div class="xp-metric">
        <div class="xp-metric-label muted" i18n="Label: to spend XP@@xp.toSpendLabel">
          To spend
        </div>
        <div class="xp-metric-value">{{ xpCurrent }}</div>
      </div>

      <div class="xp-metric">
        <div
          class="xp-metric-label muted"
          i18n="Label: total earned XP@@xp.totalEarnedLabel"
        >
          Total
        </div>
        <div class="xp-metric-value">{{ xpTotalEarned }}</div>
      </div>
    </div>
  </div>

  <div class="xp-progress-label muted" i18n="Label: to next profession@@xp.toNextProfession">
    To next profession
  </div>
  <div
    class="xp-bar"
    role="progressbar"
    [attr.aria-valuenow]="xpCurrent"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="xpMax"
  >
    <div class="fill" [style.width]="xpPercent + '%'" aria-hidden="true"></div>
  </div>

  <div class="xp-numbers">
    {{ xpCurrent }} / {{ xpMax }} <span i18n="XP unit abbreviation@@xp.unit">XP</span> •
    <span class="muted"
    >(<span i18n="Label: remaining@@xp.remaining">remaining</span>
      {{ xpMissingToProfession }})</span
    >
  </div>
</mat-card>
