<!-- przeniesione 1:1 z app/talents -->
<section class="talents card">
  @if (talents.length) {
    <div class="talents-grid">
      @for (t of talents; track t.id) {
        <article class="talent-tile">
          <header class="tile-header">
            <div class="name">{{ t.name }}</div>
          </header>

          <div class="meta muted" i18n="Meta label@@talents.meta">TALENT</div>

          @if (t.description) {
            <div class="description muted">{{ t.description }}</div>
          }
        </article>
      }
    </div>
  } @else {
    <div class="empty muted" i18n="Message shown when the character has no talents@@talents.empty">
      No talents.
    </div>
  }
</section>
