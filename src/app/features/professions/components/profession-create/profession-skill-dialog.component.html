<div class="dialog" role="dialog" aria-modal="true">
  <div class="corner top-left" aria-hidden="true">
    <mat-icon fontIcon="flare"></mat-icon>
  </div>
  <div class="corner top-right" aria-hidden="true">
    <mat-icon fontIcon="flare"></mat-icon>
  </div>
  <div class="corner bottom-left" aria-hidden="true">
    <mat-icon fontIcon="flare"></mat-icon>
  </div>
  <div class="corner bottom-right" aria-hidden="true">
    <mat-icon fontIcon="flare"></mat-icon>
  </div>

  <div class="header">
    <h2 class="title" i18n="Dialog title@@profession.create.dialog.skill.title">Add Skill</h2>
    <p class="subtitle" i18n="Dialog subtitle@@profession.create.dialog.skill.subtitle">Search and select a skill to
      add.</p>
  </div>

  <div class="content">
    <mat-form-field appearance="outline" class="full">
      <mat-label i18n="Label@@profession.create.dialog.skill.label">Skill</mat-label>
      <input
        matInput
        [formControl]="skillSearchControl"
        [matAutocomplete]="auto"
      />
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="optionSelected($event)">
        @for (o of options$ | async; track o?.id ?? o?.name ?? o) {
          <mat-option [value]="o">{{ o.name }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label i18n="Label@@profession.create.dialog.skill.description.label">Description</mat-label>
      <textarea
        matInput
        rows="3"
        [formControl]="descriptionControl"
      ></textarea>
    </mat-form-field>

    @if (existingSkillNames.length) {
      <div class="existing" aria-label="Already added skills"
           i18n-aria-label="ARIA@@profession.create.dialog.skill.existing.aria">
        <div class="existing__title" i18n="Section title@@profession.create.dialog.skill.existing.title">
          Alternatives (click to select)
        </div>

        <div class="existing__choices" aria-label="Choose alternatives"
             i18n-aria-label="ARIA@@profession.create.dialog.skill.alternatives.aria">
          @for (s of existingSkillsStructured; track s?.id) {
            <button
              mat-stroked-button
              type="button"
              class="existing__choice"
              [class.existing__choice--selected]="selectedAlternativeIds.includes(s.id)"
              (click)="toggleAlternative(s.id)"
            >
              <span class="existing__choice__label">{{ s.name }}</span>
              @if (selectedAlternativeIds.includes(s.id)) {
                <mat-icon class="existing__choice__icon">check</mat-icon>
              }
            </button>
          }
        </div>
      </div>
    }
  </div>

  <div class="actions">
    <app-wax-seal-button
      variant="cancel"
      icon="close"
      label="Cancel"
      i18n-label="Button@@profession.create.dialog.skill.cancel"
      (clicked)="cancel()"
    ></app-wax-seal-button>

    <app-wax-seal-button
      variant="save"
      icon="add"
      label="Add"
      i18n-label="Button@@profession.create.dialog.skill.add"
      [disabled]="!selectedOption"
      (clicked)="add()"
    ></app-wax-seal-button>
  </div>
</div>
