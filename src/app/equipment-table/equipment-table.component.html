<div class="equipment-table mat-elevation-z1">
  <table mat-table [dataSource]="dataSource" class="mat-table equipment-table__table">

    <thead class="equipment-table__head">
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    </thead>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="table-header"
          i18n="Nagłówek kolumny: nazwa broni/ekwipunku@@equipment.col.name"> Weapon / Gear
      </th>
      <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="enc">
      <th mat-header-cell *matHeaderCellDef class="table-header" i18n="Nagłówek kolumny: obciążenie@@equipment.col.enc">
        Enc
      </th>
      <td mat-cell *matCellDef="let element"> {{ element.enc }}</td>
    </ng-container>

    <ng-container matColumnDef="dmg">
      <th mat-header-cell *matHeaderCellDef class="table-header" i18n="Nagłówek kolumny: obrażenia@@equipment.col.dmg">
        Dmg
      </th>
      <td mat-cell *matCellDef="let element"> {{ element.dmg }}</td>
    </ng-container>

    <ng-container matColumnDef="range">
      <th mat-header-cell *matHeaderCellDef class="table-header" i18n="Nagłówek kolumny: zasięg@@equipment.col.range">
        Range
      </th>
      <td mat-cell *matCellDef="let element"> {{ element.range }}</td>
    </ng-container>

    <ng-container matColumnDef="qualities">
      <th mat-header-cell *matHeaderCellDef class="table-header"
          i18n="Nagłówek kolumny: cechy/jakości@@equipment.col.qualities"> Qualities
      </th>
      <td mat-cell *matCellDef="let element"> {{ element.qualities }}</td>
    </ng-container>

    <tr mat-row *matRowDef="let _row; columns: displayedColumns"></tr>
  </table>
</div>
